[project]
name = "datalang"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hawlermathew2007", email = "139537864+hawlermathew2007@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.0",
    "fastapi>=0.143.0",
    "pint>=0.26.2",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
datalang = "datalang:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
