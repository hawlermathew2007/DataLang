[project]
name = "pdpa-guard"
version = "0.1.0"
description = "PDPA data-foundation scoring, masking, policy-as-code and activity monitoring for Singapore SMEs"
authors = [{ name = "pyaesonephyo" }]
requires-python = ">=3.11"
dependencies = ["streamlit>=1.50", "pandas>=2.2", "pydantic>=2.6", "pyyaml>=6", "openpyxl>=3.1", "psycopg[binary]>=3.1", "sqlglot>=25", "pypdf>=5", "python-docx>=1.1"]

[project.optional-dependencies]
nlp = ["transformers>=4.40", "torch>=2.2", "sentence-transformers>=3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
