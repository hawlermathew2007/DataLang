  connect:
    image: ${CDC_CONNECTOR}
    # network_mode: host  # suppose can make kafka connect connect to datahub hosts, but not working in Mac for whatever reason
    ports:
    - "8083:8083"
    networks:
    - datahub_net
    environment:
      BOOTSTRAP_SERVERS: broker:29092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: db_connect_configs
      OFFSET_STORAGE_TOPIC: db_connect_offsets
      STATUS_STORAGE_TOPIC: db_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      CLASSPATH: /kafka/connect/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  datahub_net:
    name: datahub_network
    external: true

